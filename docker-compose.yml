services:
  db:
    image: postgres:15
    container_name: creatus_car_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creatus_car
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: creatus_car_api
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/creatus_car
      - JWT_SECRET=${JWT_SECRET:-jwt-secret-key-999}
      - NODE_ENV=${NODE_ENV:-development}
      - LINE_NOTIFY_TOKEN=${LINE_NOTIFY_TOKEN:-}
      - GOOGLE_SHEETS_CREDENTIALS=${GOOGLE_SHEETS_CREDENTIALS:-}
      - GOOGLE_SHEETS_SPREADSHEET_ID=${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      - SA_EMPLOYEE_ID=${SA_EMPLOYEE_ID:-SA001}
      - SA_PASSWORD=${SA_PASSWORD:-Creatus@123}
    command: ["pnpm", "dev"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    container_name: creatus_car_ui
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    command: ["pnpm", "dev"]
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.next/cache
    depends_on:
      - api

volumes:
  postgres_data:

